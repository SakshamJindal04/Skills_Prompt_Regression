  # ============================================================================
  # TARGET: short_summarizer
  # Must produce a summary of at most 40 words that captures core facts
  # ============================================================================
  - id: summ_01
    target: short_summarizer
    suite: summary
    slices:
      category: tech
      difficulty: easy
      edge_case: "false"
    input: "Quantum computing researchers at MIT have built a 100-qubit coherent system capable of running fault-tolerant surface codes at room temperature, potentially reducing cryogenic refrigeration expenses by 90% for industrial applications."
    checks:
      - type: max_words
        count: 40
      - type: contains
        values: ["MIT"]

  - id: summ_02
