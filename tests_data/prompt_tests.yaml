# Comprehensive Test Suite for Prompts and Skill Selection
# >= 40 test cases across diverse slices, domains, and difficulty levels

tests:
  # ============================================================================
  # TARGET: sentiment_classifier
  # Must output exactly one of: POSITIVE, NEGATIVE, NEUTRAL (no punctuation, no prose)
  # ============================================================================
  - id: sent_01
    target: sentiment_classifier
    suite: sentiment
    slices:
      category: customer_support
      difficulty: easy
      edge_case: "false"
    input: "The customer service agent resolved my issue within three minutes and was extremely friendly!"
    checks:
      - type: exact_match
        value: "POSITIVE"
      - type: max_words
        count: 1

