# 120-Task Comprehensive Benchmark Suite for Skill Selection
# Partitioned into 5 evaluation categories:
# 1. clear (60 tasks, 5 per skill)
# 2. ambiguous (20 tasks)
# 3. paraphrased (20 noisy/slang tasks)
# 4. multi_skill (10 multi-step tasks)
# 5. out_of_scope (10 abstention tasks)

benchmarks:
  # ==========================================
  # CATEGORY: CLEAR (60 tasks, 5 per skill)
  # ==========================================
