[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "regguard"
version = "1.0.0"
description = "Skill & Prompt Regression Manager for Local Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "pymysql",
    "pyyaml",
    "fastapi>=0.100",
    "uvicorn",
    "scipy",
    "numpy",
    "pandas",
    "streamlit>=1.30",
    "plotly",
    "requests",
    "python-dotenv",
    "alembic",
    "playwright",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff",
    "mypy",
    "bandit",
    "pip-audit",
]

[project.scripts]
regguard = "cli:main"

[tool.setuptools]
packages = ["core", "app"]
py-modules = ["cli"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E402", "F401", "F841"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
disable_error_code = ["var-annotated", "arg-type", "call-arg", "attr-defined", "misc", "valid-type", "assignment", "return-value", "index", "union-attr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
