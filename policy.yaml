# Policy configuration for regression gate evaluation
version: "1.0.0"
alpha: 0.05
minimum_tests: 10
k: 5
allowed_models:
  - "qwen2.5:3b"
  - "qwen2.5:7b"
  - "qwen2.5:latest"
  - "llama3.2:3b"
  - "gemma2:2b"
  - "qwen3:4b"
# Governance & access control roles
roles:
  - "author"
  - "reviewer"
  - "approver"
default_local_role:
  - "author"
  - "reviewer"

# Operational controls
freeze: false
require_approval_for_rollback: true
quarantine_consistency_threshold: 0.70
skill_overlap_threshold: 0.75

critical_test_ids:
  - "ent_01"
  - "sent_01"
  - "sum_01"
  - "doc_json_crit_01"
  - "doc_json_crit_02"
  - "sql_crit_01"
  - "sql_crit_02"
  - "meet_crit_01"
  - "meet_crit_02"
  - "traj_01"
  - "traj_03"
  - "traj_09"
  - "traj_10"
  - "traj_17"
  - "traj_18"
  - "traj_25"
  - "traj_33"
  - "traj_34"
required_approvers:
  - "Alice Reviewer"
  - "Bob Lead"
  - "Carol Admin"

# Tier 1 Decision Quality Rules & Evidence
active_decision_rule: "mcnemar_exact"  # Options: mcnemar_exact, non_inferiority, holm_bonferroni, odds_ratio
non_inferiority_margin: 0.05
odds_ratio_threshold: 1.5

# Beyond Pass/Fail Monitoring Controls
beyond_pass_fail:
  flag_semantic_drift: true
  semantic_drift_threshold: 0.85
  block_on_semantic_drift: false
  flag_latency_regression: true
  latency_p95_diff_threshold_ms: 500.0
  block_on_latency_regression: false
  flag_length_drift: true
  length_ratio_threshold: 0.50
  block_on_length_drift: false


